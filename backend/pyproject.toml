[project]
name = "book-embeddings-pipeline"
version = "0.1.0"
description = "Backend script to extract content from book site, generate embeddings with Cohere, and store in Qdrant"
authors = [{name = "Developer", email = "dev@example.com"}]
dependencies = [
    "cohere>=5.5.8",
    "qdrant-client>=1.9.1",
    "beautifulsoup4>=4.12.2",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "pytest>=7.4.3"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"